name: Sonda do SDK Android (temporária)
on:
  push:
    branches: ['ci/probe-java']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet workload install android
      - name: Javac.targets
        run: |
          T=$(ls -d /usr/share/dotnet/packs/Microsoft.Android.Sdk.Linux/*/tools | head -1)
          sed -n 30,230p "$T/Xamarin.Android.Javac.targets"
      - name: AvailableItems
        run: |
          T=$(ls -d /usr/share/dotnet/packs/Microsoft.Android.Sdk.Linux/*/tools | head -1)
          sed -n 50,62p "$T/Xamarin.Android.AvailableItems.targets"
