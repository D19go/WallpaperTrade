name: Sonda do SDK Android (temporária)
on:
  push:
    branches: ['ci/probe-java']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet workload install android
      - name: Onde o AndroidJavaSource é usado
        run: |
          T=$(ls -d /usr/share/dotnet/packs/Microsoft.Android.Sdk.Linux/*/tools | head -1)
          echo "tools: $T"
          grep -rn "AndroidJavaSource" "$T"/*.targets "$T"/*.props 2>/dev/null | cut -c1-260
      - name: Alvo que gera o jar de binding em apps
        run: |
          T=$(ls -d /usr/share/dotnet/packs/Microsoft.Android.Sdk.Linux/*/tools | head -1)
          grep -n "_CompileBindingJava\|_CreateJavaSources\|_GenerateJavaStubs\|_CompileJava\b\|binding/bin\|AndroidJavaLibrary\|_AndroidJarFile\|ExcludeFromAndroid" "$T"/Xamarin.Android.Bindings.Core.targets "$T"/Xamarin.Android.Javac.targets "$T"/Xamarin.Android.Common.targets 2>/dev/null | cut -c1-240 | head -80
